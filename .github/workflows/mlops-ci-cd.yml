# CI/CD of CardioAgent-Ops: run the tests with a coverage gate, then build and smoke-test the Docker images.
name: mlops-ci-cd

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies (dev + audio groups, no notebook packages)
        run: uv sync --locked --no-group notebook

      # test_api.py (gateway), test_audio.py + test_audio_service.py (audio-engine), test_agents.py (agents schema)
      - name: Run pytest with coverage (fails if coverage < 80%)
        run: uv run pytest --cov=api --cov=audio_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build ${{ matrix.service }} image
    needs: test            # only build if the tests pass
    runs-on: ubuntu-latest
    strategy:
      matrix:              # the same steps, once per image (in parallel)
        include:
          - service: api-gateway
            port: 8000
          - service: audio-engine
            port: 8001
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f docker/${{ matrix.service }}.Dockerfile -t ${{ matrix.service }}:${{ github.sha }} .

      - name: Smoke test (start the container and call /health)
        run: |
          docker run -d --name app -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.service }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ matrix.port }}/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Image size
        run: docker image ls ${{ matrix.service }}:${{ github.sha }}
