# CI/CD for Service 5 (api-gateway): run the tests with coverage, then build and smoke-test the Docker image.
name: mlops-ci-cd

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies (dev + audio groups, no notebook packages)
        run: uv sync --locked --no-group notebook

      - name: Run pytest with coverage (gateway + TP3 audio_engine, fails if coverage < 80%)
        run: uv run pytest --cov=api --cov=audio_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build api-gateway image
    needs: test            # only build if the tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f docker/api-gateway.Dockerfile -t api-gateway:${{ github.sha }} .

      - name: Smoke test (start the container and call /health)
        run: |
          docker run -d --name gateway -p 8000:8000 api-gateway:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs gateway
          exit 1
