[project]
name = "cardioagent-ops"
version = "0.1.0"
description = "CardioAgent-Ops - Service 5: api-gateway (FastAPI)"
requires-python = ">=3.11"  # 3.11 for the audio-engine image, 3.13 for the gateway image
# Packages needed to RUN the api-gateway (these go into the Docker image)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # FastAPI needs it to receive uploaded files
    "httpx>=0.27",              # to call audio-engine and the orchestrator
    "pydantic>=2.7",
]

[dependency-groups]
# Only for development: tests and coverage
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Only for the notebooks/ (not needed by the API)
notebook = [
    "numpy",
    "matplotlib",
    "ipykernel",
]
# TP3: feature extraction + SVM training + MLflow tracking (Service 3 audio-engine)
audio = [
    "mlflow==2.17.2",
    "sqlalchemy<2.0.40",  # mlflow 2.17.2 crashes with newer sqlalchemy (FallbackAsyncAdaptedQueuePool)
    "scikit-learn",
    "librosa",
    "soundfile",
    "matplotlib",
    "pandas",
]

[tool.uv]
package = false                                 # this is an app, not a library to publish
default-groups = ["dev", "notebook", "audio"]   # installed locally by "uv sync"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so the tests can "import api"
